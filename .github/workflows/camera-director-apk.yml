name: Build Camera Director APK

on:
  push:
    paths:
      - "CameraDirector/**"
      - ".github/workflows/camera-director-apk.yml"
  pull_request:
    paths:
      - "CameraDirector/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CameraDirector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CameraDirector-apk
          path: CameraDirector/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
